# Dependency update PRs for the SDK's npm packages (root and playground) and the workflows' actions
# (CI rollout, P3).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /playground
    schedule:
      interval: weekly
    # Wait a week before proposing a freshly published version, so a compromised release is usually
    # caught and pulled before it gets here (semgrep dependabot-missing-cooldown).
    cooldown:
      default-days: 7
    # No automatic rebase when main moves: each rebase re-runs the AI reviews. A PR in conflict
    # needs `@dependabot rebase`.
    rebase-strategy: disabled
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one weekly PR per directory. A major stays its own PR.
    # Security updates arrive as one PR.
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Keeps the SHA-pinned `uses:` refs (with their version comments) on the latest release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    rebase-strategy: disabled
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
